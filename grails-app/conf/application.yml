---
grails:
    resources:
        pattern: '/**'
    profile: web
    codegen:
        defaultPackage: media
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false
    cache:
        cacheManager: GrailsConcurrentLinkedMapCacheManager
        caches:
            api:
                maxCapacity: 5000
            maps:
                maxCapacity: 6000
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
    logging:
        file: "logFile.log"
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            exclude:
                - 'grails-app/views/**'
                - 'grails-app/i18n/**'
                - 'grails-app/conf/**'
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback.groovy'
                - '*.properties'
    servlet:
        multipart:
            enabled: true
            max-file-size: 300MB
            max-request-size: 300MB

management:
    endpoints:
        #enabled-by-default: false
        web:
            exposure:
                include: "health"
            base-path: "/"

logging:
    file:
        name: "logs/logFile.log"
    level:
        root: ERROR

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
        upload:
            # 300 * 1024 * 1024
            maxFileSize: 419430400
            maxRequestSize: 419430400
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none

hibernate:
    format_sql: true

dataSource:
    pooled: true
    jmxExport: true
    driverClassName: com.mysql.cj.jdbc.Driver
    dialect: org.hibernate.dialect.MySQL8Dialect
    properties:
        poolName: "Grails6HikariPool"
        readOnly: true
        # Keep connections alive — must be LESS than MySQL wait_timeout
        keepaliveTime: 120000          # ping idle connections every 2 min (ms)
        idleTimeout: 300000            # remove connections idle > 5 min (ms)
        maxLifetime: 600000            # recycle connections after 10 min (ms)
        # MUST be < MySQL wait_timeout

        # Connection validation
        connectionTestQuery: SELECT 1  # fallback for drivers without isValid()
        connectionTimeout: 30000        # fail fast if no connection in 30s (ms)
        validationTimeout: 5000         # how long to wait to validate (ms)

        # Pool sizing (tune to your instance)
        minimumIdle: 2
        maximumPoolSize: 10

        # Auto-recovery from dropped connections
        initializationFailTimeout: 1  # fail fast at startup if DB unreachable

