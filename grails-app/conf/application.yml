---
grails:
    resources:
        pattern: '/**'
    profile: web
    codegen:
        defaultPackage: media
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false
    cache:
        cacheManager: GrailsConcurrentLinkedMapCacheManager
        caches:
            api:
                maxCapacity: 5000
            maps:
                maxCapacity: 6000
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
spring:
    datasource:
      tomcat:
          test-while-idle: true
#          time-between-eviction-runs-millis: 60000
          validation-query: SELECT 1
          test-on-borrow: true
          validation-interval: 30000 # 30s
    logging:
        file: "logFile.log"

    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            exclude:
                - 'grails-app/views/**'
                - 'grails-app/i18n/**'
                - 'grails-app/conf/**'
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback.groovy'
                - '*.properties'
    servlet:
        multipart:
            enabled: true
            max-file-size: 300MB
            max-request-size: 300MB

management:
    endpoints:
        #enabled-by-default: false
        web:
            exposure:
                include: "health"
            base-path: "/"

logging:
    file: "logs/logFile.log"
    level:
        root: ERROR

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
        upload:
            # 300 * 1024 * 1024
            maxFileSize: 419430400
            maxRequestSize: 419430400
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none

hibernate:
    format_sql: true
    c3p0:
        min_size: 5
        max_size: 20
        timeout: 60
        testConnectionOnCheckout: true
        preferredTestQuery: "SELECT 1"

#        queries: false
#        use_second_level_cache: true
#        use_query_cache: false
